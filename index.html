<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>FMA Texture</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b;
    --txt:#e6e9ee; --mut:#8b95a3; --acc:#4fa3ff; --ok:#3ecf8e; --warn:#f5b941; --err:#ff5d5d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button,select,input{font:inherit;color:inherit}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
  button.rec{background:var(--err);border-color:var(--err);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  input[type=number]{width:80px}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0 12px 0 0;font-weight:650}
  .sp{flex:1}
  .muted{color:var(--mut)}
  .pill{font:12px var(--mono);padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
  main{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px;height:calc(100% - 56px)}
  #devices{overflow:auto;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .dev .top{display:flex;align-items:center;gap:8px}
  .dev .sw{width:12px;height:12px;border-radius:3px;flex:none}
  .dev .name{background:transparent;border:none;padding:0;font-weight:600;flex:1;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}
  .dev .vals{display:grid;grid-template-columns:minmax(0,1fr) auto;white-space:nowrap;gap:1px 10px;margin:8px 0 2px;font:13px var(--mono)}
  .dev .vals .k{color:var(--mut);overflow:hidden;text-overflow:ellipsis} .dev .vals .v{text-align:right}
  .dev .vals .big{font-size:20px;font-weight:600}
  .dev .stat{font:12px var(--mono);color:var(--mut)}
  .dev .stat .bad{color:var(--warn)}
  .dev .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .dev .btns button{padding:4px 8px;font-size:12px}
  .empty{color:var(--mut);text-align:center;padding:24px 8px}
  #right{display:grid;grid-template-rows:minmax(320px,1.8fr) minmax(180px,1fr);gap:12px;min-height:0}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
  .bar label{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:13px}
  #mainCard{display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;gap:4px;margin-bottom:8px}
  .tabs button{border-radius:6px 6px 0 0;border-bottom:none;padding:5px 12px}
  .tabs button.act{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
  .view{display:none;flex:1;min-height:0;flex-direction:column}
  .view.act{display:flex}
  #chToggles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  #chToggles label{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;display:flex;gap:4px;align-items:center;cursor:pointer}
  #panels{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
  .panel{position:relative;height:150px;flex:none;border:1px solid var(--line);border-radius:6px;background:#12161b}
  .panel canvas,.fill canvas{position:absolute;inset:0;width:100%;height:100%}
  .fill{position:relative;flex:1;min-height:200px;border:1px solid var(--line);border-radius:6px;background:#12161b}
  #specWrap{display:grid;grid-template-rows:1fr 1fr;gap:6px;flex:1;min-height:260px}
  #specWrap .fill{min-height:120px}
  #v-spec{overflow:auto}
  #settings{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;font-size:13px;color:var(--mut)}
  #settings label{display:flex;align-items:center;gap:6px}
  #consoleCard{display:flex;flex-direction:column;min-height:0}
  #console{flex:1;overflow:auto;background:#0b0d10;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all}
  #console .t{color:var(--mut)} #console .err{color:var(--err)} #console .warn{color:var(--warn)} #console .tx{color:var(--acc)} #console .sys{color:#b48cff}
  .send{display:flex;gap:6px;margin-top:8px} .send input{flex:1;min-width:0}
  #label{width:150px} #speed{width:70px}
  #mobnav{display:none}
  /* ---------- phone layout: one section at a time, bottom navigation ---------- */
  @media (max-width:820px){
    header{padding:8px 10px} header h1{font-size:15px;margin-right:4px}
    #support,.desk{display:none}
    main{display:block;height:calc(100% - 52px - 58px);padding:8px;overflow:auto}
    #right{display:block}
    #devices,#mainCard,#consoleCard{display:none}
    body[data-m="dev"] #devices{display:flex}
    body[data-m="sig"] #mainCard,body[data-m="map"] #mainCard,body[data-m="spec"] #mainCard{display:flex;height:100%}
    body[data-m="dbg"] #consoleCard{display:flex;height:100%}
    #mainCard .tabs{display:none}
    .panel{height:170px}
    #mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
      background:var(--panel);border-top:1px solid var(--line);z-index:5}
    #mobnav button{flex:1;border:none;border-radius:0;background:transparent;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    #mobnav button b{font-size:17px;font-weight:400}
    #mobnav button.act{color:var(--acc)}
    .bar{gap:6px}
    #chToggles{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
    #chToggles label{flex:none}
  }
</style>
</head>
<body data-m="dev">
<header>
  <h1>FMA Texture</h1>
  <button class="pri" id="btnSerial">+ USB</button>
  <button id="btnDemo">+ Demo</button>
  <label class="muted desk">Baud
    <select id="baud"><option>115200</option><option>230400</option><option>460800</option><option>921600</option></select>
  </label>
  <span class="sp"></span>
  <button id="btnInstall" style="display:none">Install app</button>
  <span class="pill" id="support"></span>
</header>

<main>
  <section id="devices">
    <div class="empty" id="noDev">No devices.<br>Connect the XIAO Sense with a USB cable<br>(on the phone: USB-C / OTG), or try Demo.</div>
  </section>

  <section id="right">
    <div class="card" id="mainCard">
      <div class="tabs">
        <button data-v="sig" class="act">Signals</button>
        <button data-v="map">Texture map</button>
        <button data-v="spec">Spectrum &amp; settings</button>
      </div>
      <div class="bar">
        <label>Window
          <select id="win"><option value="5">5 s</option><option value="10" selected>10 s</option><option value="30">30 s</option><option value="60">60 s</option><option value="120">120 s</option></select>
        </label>
        <button id="btnPause">Pause</button>
        <label title="Sliding speed: turns texture frequency into spatial period">Speed <input type="text" id="speed" inputmode="decimal" placeholder="mm/s"></label>
        <label>Label <input type="text" id="label" placeholder="e.g. sandpaper_120"></label>
        <button id="btnMark">Mark</button>
        <button id="btnRec">● Record</button>
        <span class="pill" id="recInfo">0 rows</span>
        <button id="btnCsv">CSV</button>
        <button id="btnRaw" title="Capture the raw stream: mic as WAV, accelerometer and force as CSV">● Raw</button>
      </div>

      <div class="view act" id="v-sig">
        <div id="chToggles"></div>
        <div id="panels"></div>
      </div>

      <div class="view" id="v-map">
        <div class="bar"><span class="muted">Points while sliding · color = Label · big dot = mean</span><span class="sp"></span><button id="btnClearMap">Clear map</button></div>
        <div class="fill"><canvas id="map"></canvas></div>
      </div>

      <div class="view" id="v-spec">
        <div class="bar">
          <label>Device <select id="specDev"></select></label>
          <span class="muted">Live spectrum (bright) vs learned background (gray)</span>
        </div>
        <div id="specWrap">
          <div class="fill"><canvas id="specA"></canvas></div>
          <div class="fill"><canvas id="specM"></canvas></div>
        </div>
        <div id="settings">
          <label>Contact force <input type="number" id="setF" step="0.05" value="0.15"> N</label>
          <label><input type="checkbox" id="setGate" checked> require contact force</label>
          <label>Sliding threshold <input type="number" id="setOn" step="0.5" value="4"> dB</label>
          <label>Periodic if peak/mean ≥ <input type="number" id="setProm" step="1" value="8"></label>
          <label>Mic weight <input type="number" id="setMicW" step="0.05" value="0.35" min="0" max="1"></label>
          <button id="btnLearnAll">Learn background (all)</button>
        </div>
      </div>
    </div>

    <div class="card" id="consoleCard">
      <div class="bar">
        <strong>Debug</strong>
        <label>Show <select id="filter"><option value="all">all</option></select></label>
        <label><input type="checkbox" id="autoscroll" checked> autoscroll</label>
        <span class="sp"></span>
        <button id="btnSaveDbg">Save</button>
        <button id="btnClearDbg">Clear</button>
      </div>
      <div id="console"></div>
      <div class="send">
        <select id="target"><option value="all">→ all</option></select>
        <input type="text" id="cmd" placeholder="Command (t = tare, r = remove tare, i = info)">
        <button id="btnSend">Send</button>
      </div>
    </div>
  </section>
</main>

<nav id="mobnav">
  <button data-m="dev" class="act"><b>◉</b>Devices</button>
  <button data-m="sig"><b>∿</b>Signals</button>
  <button data-m="map"><b>⁘</b>Map</button>
  <button data-m="spec"><b>▥</b>Spectrum</button>
  <button data-m="dbg"><b>≡</b>Debug</button>
</nav>

<script>
"use strict";
// =====================================================================
//  Constants & channel metadata
// =====================================================================
const COLORS = ["#4fa3ff","#3ecf8e","#f5b941","#ff6b9a","#b48cff","#46d6db","#ff8a4c","#c2e05a"];
const KEEP_S = 130, MAX_DBG = 1500;
const META = {
  force:     { label: "Force",                 unit: "N",    order: 0,  dec: 3 },
  tex_int:   { label: "Texture intensity",     unit: "/100", order: 1,  dec: 1 },
  tex_hz:    { label: "Texture frequency",     unit: "Hz",   order: 2,  dec: 1 },
  tex_period:{ label: "Spatial period",        unit: "mm",   order: 3,  dec: 3 },
  tex_conf:  { label: "Frequency confidence",  unit: "%",    order: 4,  dec: 0 },
  tex_on:    { label: "Sliding",               unit: "",     order: 5,  dec: 0, hidden: true },
  temp:      { label: "Temperature",           unit: "°C",   order: 6,  dec: 1, hidden: true },
  tex_src:   { label: "Freq. source 1=acc 2=mic 3=both", unit: "", order: 20, dec: 0, hidden: true },
  acc_snr:   { label: "Accel above background", unit: "dB",  order: 21, dec: 1, hidden: true },
  acc_hz:    { label: "Accel frequency",       unit: "Hz",   order: 22, dec: 1, hidden: true },
  acc_mg:    { label: "Accel excess RMS",      unit: "mg",   order: 23, dec: 2, hidden: true },
  acc_prom:  { label: "Accel peak prominence", unit: "",     order: 24, dec: 1, hidden: true },
  mic_snr:   { label: "Mic above background",  unit: "dB",   order: 25, dec: 1, hidden: true },
  mic_hz:    { label: "Mic frequency",         unit: "Hz",   order: 26, dec: 1, hidden: true },
  mic_prom:  { label: "Mic peak prominence",   unit: "",     order: 27, dec: 1, hidden: true },
  vib_mg:    { label: "Vibration RMS",         unit: "mg",   order: 10, dec: 1 },
  vib_hz:    { label: "Vibration frequency",   unit: "Hz",   order: 11, dec: 0 },
  mic_db:    { label: "Sound level",           unit: "dBFS", order: 12, dec: 1 },
};
const meta = k => META[k] || { label: k, unit: "", order: 100, dec: 3 };
const CSV_NAMES = ["force", "temp"];

const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const devices = new Map(), channels = new Map(), markers = [];
let nextId = 1, paused = false, pausedAt = 0, recording = false, logRows = [];
const dbgEntries = [];

const hasSerial = "serial" in navigator;
$("support").textContent = `Web Serial ${hasSerial ? "✓" : "✗"}`;
if (!hasSerial) $("btnSerial").disabled = true;

// =====================================================================
//  Binary protocol  (A5 5A | type | len16 | payload | crc8)
// =====================================================================
const CRC_TABLE = (() => { const t = new Uint8Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 0x80 ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff; t[i] = c; }
  return t; })();
function crc8(buf, start, n) { let c = 0; for (let i = start; i < start + n; i++) c = CRC_TABLE[c ^ buf[i]]; return c; }
const T_INFO = 1, T_ACC = 2, T_MIC = 3, T_FORCE = 4, T_TEXT = 5;

class Decoder {
  constructor(onPacket, onTextLine) { this.onPacket = onPacket; this.onText = onTextLine; this.buf = new Uint8Array(0); this.text = ""; this.bad = 0; }
  push(chunk) {
    let b;
    if (this.buf.length) { b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); }
    else b = chunk;
    let i = 0; const n = b.length;
    while (i < n) {
      if (b[i] === 0xA5) {
        if (i + 1 >= n) break;
        if (b[i + 1] === 0x5A) {
          if (i + 5 > n) break;
          const type = b[i + 2], len = b[i + 3] | (b[i + 4] << 8);
          if (type >= 1 && type <= 5 && len <= 4096) {
            if (i + 6 + len > n) break;                                   // wait for the rest
            if (crc8(b, i + 2, 3 + len) === b[i + 5 + len]) {
              this.onPacket(type, b.subarray(i + 5, i + 5 + len));
              i += 6 + len; continue;
            }
            this.bad++;
          }
        }
      }
      // not a packet: maybe a text line from an old (text) sketch
      const c = b[i++];
      if (c === 10) { const l = this.text.replace(/\r$/, ""); this.text = ""; if (l.trim()) this.onText(l); }
      else if (c >= 32 && c < 127 || c === 9 || c === 13) { this.text += String.fromCharCode(c); if (this.text.length > 300) this.text = ""; }
      else this.text = "";
    }
    this.buf = b.slice(i);
  }
}
function buildPacket(type, payload) {                    // used by Demo
  const p = new Uint8Array(6 + payload.length);
  p[0] = 0xA5; p[1] = 0x5A; p[2] = type; p[3] = payload.length & 255; p[4] = payload.length >> 8;
  p.set(payload, 5); p[5 + payload.length] = crc8(p, 2, 3 + payload.length);
  return p;
}

// =====================================================================
//  Texture analysis (same algorithm previously on the board, now here)
// =====================================================================
const NA = 256, NM = 1024, NMAX = 1024;
const A_LO = 15, A_HI = 450, M_LO = 150, M_HI = 6000, BG_MARGIN = 2;
const settings = { fContact: 0.15, gate: true, onDb: 4, prom: 8, micW: 0.35 };
const TWC = new Float32Array(NMAX / 2), TWS = new Float32Array(NMAX / 2);
for (let k = 0; k < NMAX / 2; k++) { TWC[k] = Math.cos(2 * Math.PI * k / NMAX); TWS[k] = -Math.sin(2 * Math.PI * k / NMAX); }
const hann = n => { const w = new Float32Array(n); for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1)); return w; };
const WIN_A = hann(NA), WIN_M = hann(NM);
const W2A = WIN_A.reduce((s, v) => s + v * v, 0);

function fft(re, im, n) {
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const half = len >> 1, step = NMAX / len;
    for (let i = 0; i < n; i += len)
      for (let k = 0; k < half; k++) {
        const wr = TWC[k * step], wi = TWS[k * step], a = i + k, b = a + half;
        const xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
      }
  }
}

class Band {
  constructor(n, fs, lo, hi) {
    this.n = n; this.fs = fs; this.kLo = Math.ceil(lo * n / fs); this.kHi = Math.min(Math.floor(hi * n / fs), n / 2 - 1);
    const m = n / 2 + 1;
    this.ps = new Float32Array(m); this.bg = new Float32Array(m); this.ex = new Float32Array(m);
    this.psInit = false; this.bgInit = false;
    this.snrDb = 0; this.peakSnrDb = 0; this.hz = 0; this.prom = 0; this.exPow = 0; this.periodic = false;
  }
  analyze(p, learn) {
    const binHz = this.fs / this.n, nb = this.kHi - this.kLo + 1;
    let sumB = 0;
    for (let k = this.kLo; k <= this.kHi; k++) {
      this.ps[k] = this.psInit ? 0.5 * this.ps[k] + 0.5 * p[k] : p[k];
      if (learn) this.bg[k] = this.bgInit ? this.bg[k] + 0.1 * (this.ps[k] - this.bg[k]) : this.ps[k];
      sumB += this.bg[k];
    }
    this.psInit = true; if (learn) this.bgInit = true;
    const eps = 1e-3 * sumB / nb + 1e-20;
    let sumR = 0, sumE = 0, sumEf = 0, peakE = 0, pk = -1;
    for (let k = this.kLo; k <= this.kHi; k++) {
      sumR += this.ps[k] / (this.bg[k] + eps);
      let e = this.ps[k] - BG_MARGIN * this.bg[k]; if (e < 0) e = 0;
      this.ex[k] = e; sumE += e; sumEf += e * k * binHz;
      if (e > peakE) { peakE = e; pk = k; }
    }
    this.snrDb = 10 * Math.log10(sumR / nb);
    this.exPow = sumE;
    const meanE = sumE / nb;
    this.prom = meanE > 0 ? peakE / meanE : 0;
    this.peakSnrDb = pk >= 0 ? 10 * Math.log10(this.ps[pk] / (this.bg[pk] + eps)) : 0;
    this.periodic = this.prom >= settings.prom && this.peakSnrDb > 8;
    if (sumE <= 0 || (this.snrDb < 1 && !this.periodic)) { this.hz = 0; this.prom = 0; this.periodic = false; return; }
    if (this.periodic) {
      let d = 0;
      if (pk > this.kLo && pk < this.kHi) {
        const y0 = this.ex[pk - 1], y1 = this.ex[pk], y2 = this.ex[pk + 1], den = y0 - 2 * y1 + y2;
        if (den !== 0) d = Math.max(-0.5, Math.min(0.5, 0.5 * (y0 - y2) / den));
      }
      this.hz = (pk + d) * binHz;
    } else this.hz = sumEf / sumE;
  }
}
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

class Analyzer {
  constructor() {
    this.fsA = 1000; this.fsM = 16000; this.lsbG = 0.000122;
    this.reset();
  }
  reset() {
    this.ax = [new Float32Array(NA), new Float32Array(NA), new Float32Array(NA)]; this.aw = 0; this.aCount = 0;
    this.lp = [0, 0, 0]; this.lpInit = false;
    this.mic = new Float32Array(NM); this.mw = 0; this.mCount = 0;
    this.bandA = new Band(NA, this.fsA, A_LO, A_HI);
    this.bandM = new Band(NM, this.fsM, M_LO, M_HI);
    this.tex = { on: false, intensity: 0, hz: 0, conf: 0, src: 0 };
    this.learnFrames = 40; this.sinceA = 0; this.sinceM = 0;
    this.re = new Float32Array(NMAX); this.im = new Float32Array(NMAX);
    this.pA = new Float32Array(NA / 2 + 1); this.pM = new Float32Array(NM / 2 + 1);
    this.hasAcc = false; this.hasMic = false;
  }
  pushAcc(x, y, z) {                                       // in g
    const v = [x, y, z];
    if (!this.lpInit) { this.lp = v.slice(); this.lpInit = true; }
    for (let k = 0; k < 3; k++) { this.lp[k] += 0.02 * (v[k] - this.lp[k]); this.ax[k][this.aw] = v[k] - this.lp[k]; }
    this.aw = (this.aw + 1) % NA; this.aCount++; this.sinceA++; this.hasAcc = true;
  }
  pushMic(s) { this.mic[this.mw] = s; this.mw = (this.mw + 1) % NM; this.mCount++; this.sinceM++; this.hasMic = true; }
  // is it time for a new 50 ms frame?
  due() { return this.hasAcc ? this.sinceA >= this.fsA * 0.05 : (this.hasMic && this.sinceM >= this.fsM * 0.05); }
  frame(force) {
    this.sinceA = 0; this.sinceM = 0;
    if ((this.hasAcc && this.aCount < NA) || (this.hasMic && this.mCount < NM)) return null;   // windows not full yet
    const { re, im, pA, pM } = this;
    pA.fill(0);

$("btnSerial").onclick = async () => {
  let port;

    port = await navigator.serial.requestPort();
    await port.open({ baudRate: +$("baud").value, bufferSize: 1 << 16 });
    try { await port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch {}
  } catch (e) { sys("USB: " + e.message, "err"); return; }
  const info = port.getInfo();
  const dev = newDevice("USB", (info.usbProductId ? `XIAO ${hex(info.usbProductId)}` : "Serial") + " #" + nextId);
  let reader = null, closing = false;
  dev.send = async txt => {
    if (!port.writable) throw new Error("port not writable");
    const w = port.writable.getWriter(); try { await w.write(enc.encode(txt)); } finally { w.releaseLock(); }
  };
  dev.close = async () => { closing = true; try { await reader?.cancel(); } catch {} try { await port.close(); } catch {} setDisconnected(dev, "closed"); };
  navigator.serial.addEventListener("disconnect", e => { if (e.target === port) setDisconnected(dev, "cable unplugged"); });
  updateWakeLock();
  setTimeout(() => dev.send("i").catch(() => {}), 400);         // ask for INFO
  (async () => {
    while (port.readable && !closing) {
      reader = port.readable.getReader();
      try { for (;;) { const { value, done } = await reader.read(); if (done) break; feedBytes(dev, value); } }
      catch (e) { if (!closing) dbg(dev, "Read error: " + e.message, "err"); }
      finally { reader.releaseLock(); }
    }
    setDisconnected(dev);
  })();
};

  let lo = Infinity, hi = -Infinity;
  for (const d of devices.values()) { const c = d.ch.get(key); if (!d.visible || !c) continue;
    for (const p of c.pts) if (p.t >= t0 && p.t <= now) { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; } }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const pad = Math.max((hi - lo) * 0.08, Math.abs(hi) * 0.01, 0.01); lo -= pad; hi += pad;
  const X = t => L + (t - t0) / win * pw, Y = v => T + (1 - (v - lo) / (hi - lo)) * ph;
  ctx.font = "11px ui-monospace,Menlo,Consolas,monospace"; ctx.strokeStyle = "#252b34"; ctx.fillStyle = "#8b95a3"; ctx.lineWidth = 1;
  const ys = niceStep(hi - lo, Math.max(2, Math.floor(ph / 30)));
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let v = Math.ceil(lo / ys) * ys; v <= hi; v += ys) { const y = Math.round(Y(v)) + .5; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke(); ctx.fillText(+v.toFixed(6) + "", L - 5, y); }
  const xs = niceStep(win / 1000, Math.max(2, Math.floor(pw / 70)));
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let s = 0; s <= win / 1000 + 1e-9; s += xs) { const x = Math.round(X(now - s * 1000)) + .5; ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke(); ctx.fillText(s === 0 ? "now" : `-${+s.toFixed(2)}s`, x, T + ph + 4); }
  // sliding shading
  for (const d of devices.values()) {
    const on = d.ch.get("tex_on"); if (!d.visible || !on) continue;
    ctx.fillStyle = d.color + "1f"; let start = null;
    for (const p of on.pts) { if (p.t < t0 - 200 || p.t > now) continue;
      if (p.v >= 0.5 && start === null) start = p.t;
      if (p.v < 0.5 && start !== null) { const a = X(Math.max(start, t0)); ctx.fillRect(a, T, X(p.t) - a, ph); start = null; } }
    if (start !== null) { const a = X(Math.max(start, t0)); ctx.fillRect(a, T, X(now) - a, ph); }
  }
  // markers
  ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = "#f5b941"; ctx.fillStyle = "#f5b941"; ctx.textAlign = "left";
  for (const mk of markers) { if (mk.t < t0 || mk.t > now) continue; const x = Math.round(X(mk.t)) + .5;
    ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke(); ctx.fillText(mk.text, x + 3, T + 2); }
  ctx.restore();
  // traces
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip(); ctx.lineWidth = 1.5; ctx.lineJoin = "round";
  for (const d of devices.values()) {
    const c = d.ch.get(key); if (!d.visible || !c || !c.pts.length) continue;
    let a = 0; while (a < c.pts.length && c.pts[a].t < t0 - 200) a++;
    const step = Math.max(1, Math.floor((c.pts.length - a) / (pw * 2)));
    ctx.strokeStyle = d.color; ctx.beginPath(); let started = false;
    for (let i = a; i < c.pts.length; i += step) { const p = c.pts[i]; if (p.t > now) break;
      const x = X(p.t), y = Y(p.v); if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#e6e9ee"; ctx.font = "600 12px system-ui,sans-serif";
  const title = `${m.label}${m.unit ? " [" + m.unit + "]" : ""}`; ctx.fillText(title, 8, 11);
  let lx = 8 + ctx.measureText(title).width + 14; ctx.font = "11px ui-monospace,Menlo,Consolas,monospace";
  for (const d of devices.values()) { const c = d.ch.get(key); if (!d.visible || !c) continue;
    const label = `${d.name} ${c.last === null ? "—" : c.last.toFixed(m.dec)}`;
    ctx.fillStyle = d.color; ctx.fillRect(lx, 10, 10, 3); ctx.fillStyle = "#cfd5dd"; ctx.fillText(label, lx + 14, 11);
    lx += ctx.measureText(label).width + 26; }
  if (paused) { ctx.fillStyle = "#f5b941"; ctx.textAlign = "right"; ctx.fillText("PAUSED", W - R - 4, 11); }
}

// =====================================================================
//  Texture map
// =====================================================================
const mapPts = [];
const LABEL_COLORS = ["#4fa3ff","#3ecf8e","#f5b941","#ff6b9a","#b48cff","#46d6db","#ff8a4c","#c2e05a","#e6e9ee"];
const labelIdx = new Map();
const labelColor = l => { if (!labelIdx.has(l)) labelIdx.set(l, labelIdx.size); return LABEL_COLORS[labelIdx.get(l) % LABEL_COLORS.length]; };
function addMapPoint(dev, v) {
  if (paused) return;
  mapPts.push({ hz: v.tex_hz, int: v.tex_int, conf: v.tex_conf ?? 100, label: $("label").value.trim() || "(no label)" });
  if (mapPts.length > 6000) mapPts.splice(0, mapPts.length - 6000);
}
$("btnClearMap").onclick = () => { mapPts.length = 0; labelIdx.clear(); };
function drawMap() {
  const r = fitCanvas($("map")); if (!r) return;
  const { c, W, H } = r, narrow = W < 520;
  const L = 44, R = narrow ? 10 : 150, T = 14, B = narrow ? 24 + 18 * Math.ceil(Math.max(1, labelIdx.size) / 2) : 24;
  const pw = W - L - R, ph = H - T - B; if (pw < 40 || ph < 40) return;
  const F0 = 1, F1 = Math.log10(8000);
  const X = hz => L + (Math.log10(Math.max(10, Math.min(8000, hz))) - F0) / (F1 - F0) * pw;
  const Y = v => T + (1 - Math.max(0, Math.min(100, v)) / 100) * ph;
  c.font = "11px ui-monospace,Menlo,Consolas,monospace"; c.strokeStyle = "#252b34"; c.fillStyle = "#8b95a3"; c.lineWidth = 1;
  c.textAlign = "center"; c.textBaseline = "top";
  for (const hz of [10, 20, 50, 100, 200, 500, 1000, 2000, 5000]) { const x = Math.round(X(hz)) + .5;
    c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke(); if (!narrow || [10, 100, 1000].includes(hz) || hz === 5000) c.fillText(hz >= 1000 ? hz / 1000 + "k" : hz, x, T + ph + 4); }
  c.textAlign = "right"; c.textBaseline = "middle";
  for (let v = 0; v <= 100; v += 25) { const y = Math.round(Y(v)) + .5; c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke(); c.fillText(v, L - 5, y); }
  c.save(); c.translate(11, T + ph / 2); c.rotate(-Math.PI / 2); c.textAlign = "center"; c.fillText("intensity", 0, 0); c.restore();
  c.textAlign = "right"; c.fillText("frequency [Hz]", L + pw, T + ph - 8);
  const stats = new Map();
  for (const p of mapPts) {
    const col = labelColor(p.label);
    c.globalAlpha = 0.15 + 0.5 * clamp01(p.conf / 100); c.fillStyle = col; c.beginPath(); c.arc(X(p.hz), Y(p.int), 2.2, 0, 7); c.fill();
    const s = stats.get(p.label) || { n: 0, lhz: 0, int: 0, col }; s.n++; s.lhz += Math.log10(Math.max(1, p.hz)); s.int += p.int; stats.set(p.label, s);
  }
  c.globalAlpha = 1; c.textBaseline = "middle"; let i = 0;
  for (const [label, s] of stats) {
    const hz = Math.pow(10, s.lhz / s.n), it = s.int / s.n;
    c.strokeStyle = "#0f1216"; c.lineWidth = 2; c.fillStyle = s.col; c.beginPath(); c.arc(X(hz), Y(it), 6, 0, 7); c.fill(); c.stroke();
    const lx = narrow ? L + (i % 2) * (pw / 2) : L + pw + 12, ly = narrow ? T + ph + 26 + Math.floor(i / 2) * 18 : T + 8 + i * 32;
    c.fillRect(lx, ly - 4, 10, 8); c.textAlign = "left"; c.fillStyle = "#cfd5dd";
    c.fillText(narrow ? `${label.slice(0, 10)} ${hz.toFixed(0)}Hz·${it.toFixed(0)}` : label.slice(0, 14), lx + 14, ly);
    if (!narrow) { c.fillStyle = "#8b95a3"; c.fillText(`${hz.toFixed(hz < 100 ? 1 : 0)} Hz · ${it.toFixed(0)}`, lx + 14, ly + 13); }
    i++;
  }
  if (!stats.size) { c.fillStyle = "#8b95a3"; c.textAlign = "center"; c.fillText("Slide the sensor on a surface: points appear here", L + pw / 2, T + ph / 2); }
}

// =====================================================================
//  Live spectrum
// =====================================================================
function drawSpectrum(cv, band, title, logX, fMin, fMax) {
  const r = fitCanvas(cv); if (!r) return;
  const { c, W, H } = r, L = 44, R = 8, T = 20, B = 20, pw = W - L - R, ph = H - T - B;
  if (pw < 40 || ph < 30) return;
  c.font = "600 12px system-ui,sans-serif"; c.fillStyle = "#e6e9ee"; c.textAlign = "left"; c.textBaseline = "middle";
  c.fillText(title, 8, 10);
  if (!band || !band.psInit) { c.font = "12px system-ui"; c.fillStyle = "#8b95a3"; c.fillText("no data", L + 10, T + ph / 2); return; }
  const binHz = band.fs / band.n, db = v => 10 * Math.log10(v + 1e-20);
  let hi = -Infinity, lo = Infinity;
  for (let k = band.kLo; k <= band.kHi; k++) { const a = db(band.ps[k]), b = db(band.bg[k]); hi = Math.max(hi, a, b); lo = Math.min(lo, a, b); }
  lo = Math.max(lo, hi - 70);
  const X = f => logX ? L + (Math.log10(f) - Math.log10(fMin)) / (Math.log10(fMax) - Math.log10(fMin)) * pw : L + (f - fMin) / (fMax - fMin) * pw;
  const Y = v => T + (1 - (v - lo) / (hi - lo + 1e-9)) * ph;
  c.font = "11px ui-monospace,Menlo,Consolas,monospace"; c.strokeStyle = "#252b34"; c.fillStyle = "#8b95a3"; c.lineWidth = 1;
  const ticks = logX ? [200, 500, 1000, 2000, 5000] : [0, 100, 200, 300, 400, 500];
  c.textAlign = "center"; c.textBaseline = "top";
  for (const f of ticks) { if (f < fMin || f > fMax) continue; const x = Math.round(X(f)) + .5; c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke(); c.fillText(f >= 1000 ? f / 1000 + "k" : f, x, T + ph + 4); }
  c.textAlign = "right"; c.textBaseline = "middle";
  const st = niceStep(hi - lo, 4);
  for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) { const y = Math.round(Y(v)) + .5; c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke(); c.fillText(v.toFixed(0), L - 4, y); }
  const line = (arr, col, w) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath();
    for (let k = band.kLo; k <= band.kHi; k++) { const x = X(k * binHz), y = Y(db(arr[k])); k === band.kLo ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); };
  line(band.bg, "#5b6573", 1.2); line(band.ps, "#4fa3ff", 1.4);
  if (band.hz > 0) { c.save(); c.setLineDash([4, 3]); c.strokeStyle = band.periodic ? "#3ecf8e" : "#f5b941"; const x = X(Math.max(fMin, band.hz));
    c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke(); c.restore();
    c.fillStyle = band.periodic ? "#3ecf8e" : "#f5b941"; c.textAlign = "left"; c.fillText(`${band.hz.toFixed(1)} Hz ${band.periodic ? "peak" : "centroid"}`, Math.min(x + 4, L + pw - 110), T + 8); }
  c.fillStyle = "#8b95a3"; c.textAlign = "right"; c.fillText(`${band.snrDb.toFixed(1)} dB above background`, L + pw, 10);
}

// =====================================================================
//  Draw loop, tabs, controls
// =====================================================================
let view = "sig";
function draw() {
  const now = paused ? pausedAt : performance.now(), win = +$("win").value * 1000;
  if (view === "sig") for (const ch of channels.values()) if (ch.visible) drawPanel(ch, now, win);
  if (view === "map") drawMap();
  if (view === "spec") {
    const d = devices.get(+$("specDev").value) || devices.values().next().value;
    drawSpectrum($("specA"), d?.an.bandA, "Accelerometer (sum of 3 axes) [dB]", false, 0, 500);
    drawSpectrum($("specM"), d?.an.bandM, "Microphone [dB]", true, 150, 6000);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function setView(v) {
  view = v;
  document.querySelectorAll("#mainCard .tabs button").forEach(b => b.classList.toggle("act", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("act", el.id === "v-" + v));
}
document.querySelectorAll("#mainCard .tabs button").forEach(b => b.onclick = () => setView(b.dataset.v));
document.querySelectorAll("#mobnav button").forEach(b => b.onclick = () => {
  document.body.dataset.m = b.dataset.m;
  document.querySelectorAll("#mobnav button").forEach(x => x.classList.toggle("act", x === b));
  if (["sig", "map", "spec"].includes(b.dataset.m)) setView(b.dataset.m);
  if (b.dataset.m === "dbg") renderConsole();
});
$("btnPause").onclick = () => { paused = !paused; pausedAt = performance.now(); $("btnPause").textContent = paused ? "Resume" : "Pause"; };

// settings (kept in this browser)
const SET_IDS = { setF: "fContact", setGate: "gate", setOn: "onDb", setProm: "prom", setMicW: "micW" };
try { Object.assign(settings, JSON.parse(localStorage.getItem("fmaSettings") || "{}")); } catch {}
for (const [id, k] of Object.entries(SET_IDS)) {
  const el = $(id);
  if (el.type === "checkbox") el.checked = settings[k]; else el.value = settings[k];
  el.onchange = () => {
    settings[k] = el.type === "checkbox" ? el.checked : parseFloat(el.value);
    try { localStorage.setItem("fmaSettings", JSON.stringify(settings)); } catch {}
  };
}
$("btnLearnAll").onclick = () => { for (const d of devices.values()) d.an.learnFrames = 40; sys("Learning background on all devices: do not touch the sensors for 2 s"); };

// markers & labels
function addMarker(text) {
  markers.push({ t: performance.now(), text });
  while (markers.length && markers[0].t < performance.now() - KEEP_S * 1000) markers.shift();
  if (recording) logRows.push({ ts: new Date().toISOString(), id: "", name: "marker", label: text, vals: {} });
  sys("Marker: " + text);
}
$("btnMark").onclick = () => addMarker($("label").value.trim() || "mark");
let lastLabel = "";
$("label").onchange = () => { const v = $("label").value.trim(); if (v !== lastLabel) { lastLabel = v; addMarker(v ? "label: " + v : "label cleared"); } };

// commands
async function sendTo(dev, txt) {
  try { await dev.send(txt); dbg(dev, "» " + txt, "tx"); } catch (e) { dbg(dev, "Send failed: " + e.message, "err"); }
}
function sendCmd() {
  const v = $("cmd").value.trim(); if (!v) return;
  const tgt = $("target").value;
  for (const d of devices.values()) if (d.connected && (tgt === "all" || +tgt === d.id)) sendTo(d, v);
  $("cmd").value = "";
}
$("btnSend").onclick = sendCmd;
$("cmd").onkeydown = e => { if (e.key === "Enter") sendCmd(); };

// debug console
function dbg(dev, msg, cls = "") { pushDbg({ ts: new Date(), dev: dev?.id ?? 0, name: dev?.name ?? "system", color: dev?.color, msg, cls }); }
function sys(msg, cls = "sys") { pushDbg({ ts: new Date(), dev: 0, name: "system", msg, cls }); }
let dbgDirty = false;
function pushDbg(e) { dbgEntries.push(e); if (dbgEntries.length > MAX_DBG) dbgEntries.splice(0, dbgEntries.length - MAX_DBG); dbgDirty = true; }
function renderConsole() {
  dbgDirty = false;
  const f = $("filter").value, c = $("console");
  const rows = dbgEntries.filter(e => f === "all" || e.dev === 0 || e.dev === +f).slice(-500);
  c.innerHTML = rows.map(e => `<div class="${e.cls}"><span class="t">${tstr(e.ts)}</span> <span style="color:${e.color || "#b48cff"}">[${esc(e.name)}]</span> ${esc(e.msg)}</div>`).join("");
  if ($("autoscroll").checked) c.scrollTop = c.scrollHeight;
}
setInterval(() => { if (dbgDirty && $("console").offsetParent) renderConsole(); }, 250);
$("filter").onchange = renderConsole;
$("btnClearDbg").onclick = () => { dbgEntries.length = 0; renderConsole(); };
$("btnSaveDbg").onclick = () => download(`fma_debug_${stamp()}.txt`, dbgEntries.map(e => `${e.ts.toISOString()} [${e.name}] ${e.msg}`).join("\n"), "text/plain");

// feature log (CSV)
$("btnRec").onclick = () => {
  recording = !recording;
  $("btnRec").textContent = recording ? "■ Stop" : "● Record"; $("btnRec").classList.toggle("rec", recording);
  sys(recording ? "Recording started" : `Recording stopped (${logRows.length} rows)`);
};
setInterval(() => { $("recInfo").textContent = logRows.length + " rows"; }, 300);
$("btnCsv").onclick = () => {
  if (!logRows.length) { sys("Nothing recorded: press Record first", "warn"); return; }
  const keys = [...new Set(logRows.flatMap(r => Object.keys(r.vals)))].filter(k => k[0] !== "_").sort((a, b) => meta(a).order - meta(b).order || a.localeCompare(b));
  const q = v => typeof v === "string" && /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const num = v => typeof v === "number" ? +v.toFixed(5) : v ?? "";
  const csv = ["timestamp,device_id,device_name,label," + keys.join(",")]
    .concat(logRows.map(r => [r.ts, r.id, q(r.name), q(r.label), ...keys.map(k => num(r.vals[k]))].join(","))).join("\n");
  download(`fma_features_${stamp()}.csv`, csv, "text/csv");
  logRows = [];
};

// raw capture: mic -> WAV, accelerometer + force -> CSV
let rawOn = false;
$("btnRaw").onclick = () => {
  rawOn = !rawOn;
  $("btnRaw").textContent = rawOn ? "■ Stop raw" : "● Raw"; $("btnRaw").classList.toggle("rec", rawOn);
  if (rawOn) { for (const d of devices.values()) d.raw = { acc: [], mic: [], force: [], label: $("label").value.trim() }; sys("Raw capture started (max 5 min)"); setTimeout(() => { if (rawOn) $("btnRaw").click(); }, 300000); return; }
  for (const d of devices.values()) {
    const r = d.raw; d.raw = null; if (!r) continue;
    const base = `fma_raw_${d.name.replace(/\W+/g, "_")}_${(r.label || "nolabel").replace(/\W+/g, "_")}_${stamp()}`;
    if (r.mic.length) download(base + "_mic.wav", wav(r.mic, 16000), "audio/wav");
    if (r.acc.length) { const lines = ["index,ax_g,ay_g,az_g"]; for (let i = 0; i < r.acc.length; i += 4) lines.push(`${r.acc[i]},${r.acc[i + 1].toFixed(5)},${r.acc[i + 2].toFixed(5)},${r.acc[i + 3].toFixed(5)}`); download(base + "_acc.csv", lines.join("\n"), "text/csv"); }
    if (r.force.length) download(base + "_force.csv", "board_ms,force_N,temp_C\n" + r.force.map(x => `${x[0]},${x[1].toFixed(4)},${x[2].toFixed(2)}`).join("\n"), "text/csv");
  }
  sys("Raw capture saved");
};
function wav(chunks, sr) {
  const n = chunks.reduce((s, c) => s + c.length, 0), b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44; for (const c of chunks) for (let i = 0; i < c.length; i++, o += 2) v.setInt16(o, c[i], true);
  return b;
}

// keep the phone screen on while a device is connected
let wakeLock = null;
async function updateWakeLock() {
  const any = [...devices.values()].some(d => d.connected && d.kind !== "DEMO");
  try {
    if (any && !wakeLock && "wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    if (!any && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") updateWakeLock(); });

// utilities
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function hex(n) { return (n ?? 0).toString(16).padStart(4, "0"); }
function tstr(d) { return d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0"); }
function stamp() { return new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19); }
function download(name, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  sys(`Saved ${name}`);
}

// PWA: offline cache + install button
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("btnInstall").style.display = ""; });
$("btnInstall").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("btnInstall").style.display = "none"; };

sys(hasSerial ? "Ready. Press + USB and pick the XIAO." :
  "This browser has no Web Serial: use Chrome (desktop, or Android 148+) or Edge. Demo still works.", hasSerial ? "sys" : "warn");
